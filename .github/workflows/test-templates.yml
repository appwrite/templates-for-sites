name: Test Templates

on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-templates:
    name: Detect Templates
    runs-on: ubuntu-latest
    outputs:
      templates: ${{ steps.set-templates.outputs.templates }}
      jaspr-templates: ${{ steps.set-jaspr-templates.outputs.templates }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect templates with package.json
        id: set-templates
        run: |
          templates=$(find . -mindepth 2 -maxdepth 2 -type d -exec test -f "{}/package.json" \; -print | sed 's|^\./||' | jq -R -s -c 'split("\n")[:-1]')
          echo "templates=$templates" >> $GITHUB_OUTPUT
          echo "Found templates:"
          echo "$templates" | jq -r '.[]'
          
          # Validate that templates were found
          template_count=$(echo "$templates" | jq '. | length')
          if [ "$template_count" -eq 0 ]; then
            echo "Error: No templates found!"
            exit 1
          fi
          echo "Total templates found: $template_count"

      - name: Detect Jaspr templates
        id: set-jaspr-templates
        run: |
          templates=$(find jaspr -mindepth 1 -maxdepth 1 -type d -exec test -f "{}/pubspec.yaml" \; -print | jq -R -s -c 'split("\n")[:-1]')
          echo "templates=$templates" >> $GITHUB_OUTPUT
          echo "Found Jaspr templates:"
          echo "$templates" | jq -r '.[]'

  test-template:
    name: Test ${{ matrix.template }}
    runs-on: ubuntu-latest
    needs: detect-templates
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.detect-templates.outputs.templates) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ${{ matrix.template }}
        run: npm install

      - name: Build template
        working-directory: ${{ matrix.template }}
        run: |
          if [ "${{ matrix.template }}" = "vite/vitepress" ]; then
            npm run docs:build
          else
            npm run build --if-present
          fi

      - name: Build Lynx web wrapper
        if: startsWith(matrix.template, 'lynx/')
        working-directory: ${{ matrix.template }}
        run: |
          npm install --prefix web
          npm run build --prefix web

  test-jaspr-template:
    name: Test ${{ matrix.template }}
    runs-on: ubuntu-latest
    needs: detect-templates
    if: needs.detect-templates.outputs.jaspr-templates != '[]'
    # Same image Appwrite Sites builds Jaspr with (flutter-3.44), which ships
    # the Jaspr CLI preinstalled
    container: openruntimes/flutter:v5-3.44
    strategy:
      fail-fast: false
      matrix:
        template: ${{ fromJson(needs.detect-templates.outputs.jaspr-templates) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: ${{ matrix.template }}
        run: dart pub get

      - name: Build template
        working-directory: ${{ matrix.template }}
        run: jaspr build

      - name: Serve template
        working-directory: ${{ matrix.template }}/build/jaspr
        run: |
          # Start the server the same way the runtime's helpers/jaspr/server.sh does
          HOST=0.0.0.0 PORT=3000 ./app &
          pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 -o /dev/null http://127.0.0.1:3000/; then
              kill $pid
              exit 0
            fi
            if ! kill -0 $pid 2>/dev/null; then
              echo "Error: Server exited before responding on /"
              exit 1
            fi
            sleep 1
          done
          echo "Error: Server did not respond on / after 30 attempts"
          exit 1
