version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/*/*"
      - "/lynx/*/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      npm-version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      npm-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: pub
    directories:
      - "/flutter/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      pub-version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      pub-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
